<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1216 496" width="1216" height="496" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d">
<title id="t">Higher fee first, by client and arrival condition</title>
<desc id="d">Share of same-block pairs of our probes (shared fee payer) in which the higher-fee probe is earlier, when it was sent at the same time or later than the lower-fee one. 95% bootstrap intervals. Data: data/ANALYSIS.md.</desc>
<style>
  .bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}
  .grid{stroke:#e1e0d9;stroke-width:1}.base{stroke:#c3c2b7;stroke-width:1}.half{stroke:#898781;stroke-width:1;stroke-dasharray:3 3}
  .s{stroke:#2a78d6;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ci{stroke:#2a78d6;stroke-width:1.5;opacity:.45}
  .dot{fill:#2a78d6;stroke:#fcfcfb;stroke-width:2}.sep{stroke:#e1e0d9;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}
    .grid{stroke:#2c2c2a}.base{stroke:#383835}.sep{stroke:#2c2c2a}
    .s{stroke:#3987e5}.ci{stroke:#3987e5}.dot{fill:#3987e5;stroke:#1a1a19}
  }
  text{font-size:11px}.t{font-size:13px;font-weight:600}.h{font-size:15px;font-weight:600}.v{font-size:10px;font-variant-numeric:tabular-nums}
</style>
<rect class="bg" width="1216" height="496"/>
<text class="h ink" x="12" y="22">Does the higher-fee transaction still land first if it arrives later? (mainnet, 2026-10-25 to 2026-10-26 UTC)</text>
<text class="ink2" x="12" y="42">Share of same-block pairs of our probes (shared fee payer) in which the higher-fee probe is earlier. 100% = ordered by fee, 0% = ordered by arrival,</text>
<text class="ink2" x="12" y="58">dashed line = coin flip. Left: probes sent within 1 ms of each other (queued before the slot / arriving mid-block). Right: higher fee sent this many ms later. Bars: 95% CI.</text>
